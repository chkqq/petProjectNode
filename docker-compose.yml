services:
  postgres:
    image: postgres:16-alpine
    container_name: pet_project_node_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pet_user
      POSTGRES_PASSWORD: pet_password
      POSTGRES_DB: pet_project_node
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pet_user -d pet_project_node']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
